<!doctype html>
<html lang="sv">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Boka bord – Kafé Kardemumma</title>
    </head>
    <body>
        <header>
            <h1>Kafé Kardemumma</h1>
            <nav aria-label="Huvudmeny">
                <ul>
                    <li><a href="index.html">Startsida</a></li>
                    <li><a href="index.html#meny">Meny</a></li>
                    <li>
                        <a href="kontakt.html" aria-current="page">Boka bord</a>
                    </li>
                </ul>
            </nav>
        </header>

        <main>
            <h2>Boka bord</h2>
            <!-- TODO: Skriv ingressen från innehall.md -->

            <form action="#" method="post">
                <div class="falt">
                    <label for="namn">Namn *</label>
                    <input type="text" id="namn" name="namn" required />
                </div>
                <div class="falt">
                    <label for="email">E-post *</label>
                    <input type="email" id="email" name="email" required />
                </div>
                <div class="falt">
                    <label for="telefon">Telefon:</label>
                    <input type="tel" id="telefon" name="telefon" />
                </div>
                <div class="falt">
                    <label for="datum">Datum *</label>
                    <input type="date" id="datum" name="datum" required />
                </div>
                <div class="falt">
                    <label for="antal">Antal personer *</label>
                    <select id="antal" name="antal" required>
                        <option value="">Välj antal</option>
                        <option value="1">1 person</option>
                        <option value="2">2 personer</option>
                        <option value="3">3 personer</option>
                        <option value="4">4 personer</option>
                        <option value="5">5 personer</option>
                        <option value="6">6 personer</option>
                    </select>
                </div>
                <div class="falt">
                    <fieldset>
                        <legend>Kostönskemål</legend>

                        <input id="vegetarisk" name="kost" type="checkbox" />
                        <label for="vegetarisk">Vegetarisk</label>

                        <input id="vegansk" name="kost" type="checkbox" />
                        <label for="vegansk">Vegansk</label>

                        <input id="glutenfri" name="kost" type="checkbox" />
                        <label for="glutenfri">Glutenfri</label>
                    </fieldset>
                </div>
                <div class="falt">
                    <fieldset>
                        <legend>Hur vill du få bekräftelsen? *</legend>
                        <input
                            type="radio"
                            id="Email"
                            name="svar"
                            value="email"
                            required
                        />
                        <label for="Email">E-post</label>
                        <input
                            type="radio"
                            id="sms"
                            name="svar"
                            value="sms"
                            required
                        />
                        <label for="sms">SMS</label>
                    </fieldset>
                </div>
                <div class="falt">
                    <label for="onskemal">Övriga önskemål</label>
                    <textarea id="onskemal" name="onskemal"></textarea>
                </div>
                <div class="falt">
                    <input
                        type="checkbox"
                        id="samtycke"
                        name="samtycke"
                        required
                    />
                    <label for="samtycke"
                        >Jag godkänner att Kafé Kardemumma sparar mina uppgifter
                        för bokningen. *</label
                    >
                </div>
                <button type="submit">Skicka bokning</button>
                <!-- TODO 1: fält för namn, e-post, telefon, datum (label + input med for/id) -->
                <!-- TODO 2: rullista för antal personer, textarea för önskemål -->
                <!-- TODO 3: fieldset + legend för kostönskemål och bekräftelsesätt -->
                <!-- TODO 4: samtyckeskryssruta (required) och skickaknapp -->
            </form>
        </main>

        <footer>
            <p>&copy; 2026 Kafé Kardemumma</p>
            <address>
                Fiktivgatan 1, 111 11 Stockholm<br />
                <a href="mailto:hej@kardemumma.example"
                    >hej@kardemumma.example</a
                >
            </address>
        </footer>
    </body>
</html>
